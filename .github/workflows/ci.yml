name: CI
on:
  push:
  pull_request:
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - if: runner.os == 'macOS'
        run: brew install libomp
      - run: python dev.py --check
      - name: Verify backend in bootstrapped environment
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then PYTHON=.venv/Scripts/python.exe; else PYTHON=.venv/bin/python; fi
          "$PYTHON" -c "import json; from backend.promote_model import main; main(json.load(open('backend/app/ml/metrics.json'))['model_version'])"
          "$PYTHON" -m pytest -q backend/tests
          "$PYTHON" backend/benchmark.py --requests 25
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - if: runner.os == 'Linux'
        run: npm run test:e2e
        working-directory: frontend
