name: CI
on:
  push:
  pull_request:
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install -r backend/requirements.txt
      - run: python backend/app/ml/train_model.py
      - run: python -c "import json; from backend.promote_model import main; main(json.load(open('backend/app/ml/metrics.json'))['model_version'])"
      - run: python -m pytest -q
        working-directory: backend
      - run: python benchmark.py --requests 25
        working-directory: backend
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
